<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Korean Lash Lift Poll — Revive Aesthetics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: #2B0F1A;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #F2E7CE;
  }
  .frame {
    width: 1080px;
    height: 1920px;
    padding: 100px 88px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* Top label */
  .eyebrow {
    font-size: 22px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #c2a878;
    opacity: 0.8;
    text-align: center;
  }

  /* Main question block */
  .question-block {
    text-align: center;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 80px;
    gap: 48px;
  }

  .question-label {
    font-size: 20px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #c2a878;
    opacity: 0.75;
  }

  .question {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 96px;
    line-height: 1.12;
    color: #F2E7CE;
    text-wrap: balance;
  }

  /* Divider */
  .rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c2a878 30%, #c2a878 70%, transparent);
    opacity: 0.35;
  }

  /* Poll buttons */
  .poll-row {
    display: flex;
    gap: 32px;
    width: 100%;
  }
  .poll-btn {
    flex: 1;
    border: 1.5px solid rgba(242, 231, 206, 0.3);
    padding: 38px 0;
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #F2E7CE;
  }
  .poll-btn.yes {
    background: rgba(194, 168, 120, 0.15);
    border-color: #c2a878;
    color: #c2a878;
  }

  /* CTA */
  .cta {
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #F2E7CE;
    opacity: 0.45;
    text-align: center;
  }

  /* Footer */
  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .footer img { width: 70px; opacity: 0.55; }
  .handle {
    font-size: 18px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #c2a878;
    opacity: 0.5;
  }
</style>
</head>
